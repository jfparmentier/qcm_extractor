# À intégrer dans un bloc server. Seul backend/public est exposé.
location ~ ^/api/(analyze-map|extract-questions)\.php$ {
    root /var/www/qcm/backend/public;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/qcm/backend/public/$1.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    client_max_body_size 26m;
    fastcgi_read_timeout 300s;
}

location ^~ /api/ {
    return 404;
}
