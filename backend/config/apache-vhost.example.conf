# Exemple : le frontend est servi depuis /var/www/qcm/frontend/dist et seul
# backend/public est exposé sous /api. Les répertoires src, prompts, schemas et
# config ne doivent jamais être placés dans le DocumentRoot.

Alias /api /var/www/qcm/backend/public

<Directory /var/www/qcm/backend/public>
    Options -Indexes
    AllowOverride FileInfo Limit
    Require all granted

    # Ajuster à QCM_MAX_PDF_BYTES avec une petite marge HTTP.
    LimitRequestBody 27262976
</Directory>

<Directory /var/www/qcm/backend>
    Require all denied
</Directory>

<Directory /var/www/qcm/backend/public>
    Require all granted
</Directory>
